name: Publish v0.1.0-beta.10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative fixes
        shell: bash
        run: |
          cp .github/workflows/release-v0.1.0-beta.9.yml /tmp/beta9.yml
          python3 - <<'PY'
          from pathlib import Path
          w=Path('/tmp/beta9.yml').read_text()
          start=w.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=w.index("\n          PY",start)
          code=w[start:end]
          exec(compile(code,'beta9-step1','exec'))
          start2=w.index("          python3 - <<'PY'\n",end)+len("          python3 - <<'PY'\n")
          end2=w.index("\n          PY",start2)
          code2=w[start2:end2]
          exec(compile(code2,'beta9-step2','exec'))
          PY

      - name: Apply beta10 focused fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile'); s=p.read_text(); s=s.replace('APP_VERSION := 0.1.0-beta.9','APP_VERSION := 0.1.0-beta.10'); p.write_text(s)

          p=Path('source/oc_profiles.hpp'); s=p.read_text()
          # Sweep must begin at the real stock/lowest RAM step, 1333 MHz.
          old='''inline int firstRamSearchIndex(const RamProfile*) {\n    // Capability discovery starts at the bottom of the sweep table and walks upward.\n    return 0;\n}'''
          new='''inline int firstRamSearchIndex(const RamProfile*) {\n    // Capability discovery begins at 1333 MHz and walks upward.\n    for (int i=0;i<int(sizeof(RAM_STEPS_MHZ)/sizeof(RAM_STEPS_MHZ[0]));++i)\n        if (RAM_STEPS_MHZ[i] >= 1333) return i;\n    return 0;\n}'''
          if old not in s: raise SystemExit('beta10 firstRamSearchIndex marker missing')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('source/main_oc.cpp'); s=p.read_text()
          # Remove candidate/last-stable clutter and keep both panels short/readable.
          old='''v.stageTitle="RAM Clock Search";v.instructionTitle="Automatic RAM sweep";v.instructionLine1="Clocks increase automatically until the first failure.";v.instructionLine2="A  Start sweep";gui::begin(v);print(1,"WARNING");print(2,"Crash or freeze can occur during limit search.");print(3,"If it happens: reboot CFW and reopen the Wizard.");print(4,"Test clocks are temporary and are not saved for boot.");print(6,"First candidate: "+std::to_string(freq)+" MHz");print(7,"Last stable: "+(g.ramStableMaxMHz?std::to_string(g.ramStableMaxMHz)+" MHz":"--"));print(10,"A : Start automatic sweep");print(11,"X : Stop / use last stable result");print(12,"B : Exit");'''
          new='''v.stageTitle="RAM Clock Search";v.instructionTitle="Automatic RAM sweep";v.instructionLine1="Tests RAM clocks from low to high.";v.instructionLine2="A  Start sweep";gui::begin(v);print(1,"WARNING");print(2,"Crash or freeze may occur.");print(3,"If it happens: reboot CFW and reopen Wizard.");print(4,"Test clocks are temporary.");print(9,"A : Start automatic sweep");print(10,"X : Stop / use last stable");print(11,"B : Exit");'''
          if old not in s: raise SystemExit('beta10 RamSweep UI marker missing')
          s=s.replace(old,new,1)

          # Reboot confirmation must not consume the A press that entered requestReboot().
          old='''    PadState rp; padConfigureInput(1,HidNpadStyleSet_NpadStandard); padInitializeDefault(&rp);\n    while(appletMainLoop()){padUpdate(&rp);u64 k=padGetButtonsDown(&rp);if(k&HidNpadButton_A)break;svcSleepThread(20'000'000);}\n    Result rc=appletRequestToReboot();'''
          new='''    PadState rp; padConfigureInput(1,HidNpadStyleSet_NpadStandard); padInitializeDefault(&rp);\n    // First require A to be fully released, then accept a fresh A press.\n    while(appletMainLoop()){padUpdate(&rp);if(!(padGetButtons(&rp)&HidNpadButton_A))break;svcSleepThread(20'000'000);}\n    while(appletMainLoop()){padUpdate(&rp);u64 k=padGetButtonsDown(&rp);if(k&HidNpadButton_A)break;svcSleepThread(20'000'000);}\n    Result rc=appletRequestToReboot();'''
          if old not in s: raise SystemExit('beta10 reboot input marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.10
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.10
          prerelease: true
          make_latest: false
          body: |
            Beta 10 focused fixes on top of Beta 9.
            - RAM capability sweep begins at 1333 MHz and walks upward.
            - Removes First candidate / Last stable clutter from the sweep start page.
            - Shortens warning and task text for readability.
            - Reboot confirmation now requires A release followed by a fresh A press.
            - Keeps current tested RAM clock display during stability tests.
            - Keeps tuning order Clock -> Tight/ST -> HP -> DVB -> SoC -> VDD2 -> VDDQ.
            - No other tuning logic changes.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
