name: Publish v0.1.0-beta.18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py
      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py
      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py
      - name: Apply beta14 config validation fixes
        run: python3 .github/scripts/build_beta14_patch.py
      - name: Apply beta15 benchmark UI and exact-value fixes
        run: python3 .github/scripts/build_beta15_patch.py
      - name: Apply beta16 RAM step-mode fix
        run: python3 .github/scripts/build_beta16_patch.py
      - name: Apply beta17 fixes
        run: python3 .github/scripts/build_beta17_patch.py
      - name: Apply beta18 preparation-validation fix
        run: python3 .github/scripts/build_beta18_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.18
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.18
          prerelease: true
          make_latest: false
          body: |
            Beta 18 unifies RAM Preparation display and validation.
            - RAM Preparation SET now correctly shows DVB Shift 8.
            - Manual A-check no longer uses hocmonVerifyOcPreparation; it reads and compares the same HOC config fields shown in SET / ACTIVE.
            - Checked fields: RAM Max Clock, Step Mode, Uncapped Clocks, VDD2, VDDQ, HP Mode, DVB Shift, SoC VMAX and Common Timings.
            - Any mismatch reports the concrete differing setting instead of a generic preparation error.
            - Automatic baseline setup remains unchanged and continues to set DVB 8 / candidate 7.
            - ACTUAL ACTIVE VALUES keep using config-selected values only.
            - RAM Max Clock Search remains 60 seconds plus visible Memory Benchmark and settling-poll verification.
            - RAM tuning order and GPU/CPU tuning logic are otherwise unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
