name: Build OC Wizard beta3

on:
  push:
    branches:
      - oc-wizard-beta3
    paths:
      - '.github/workflows/build-beta3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -j2

      - name: Upload beta3 package
        uses: actions/upload-artifact@v4
        with:
          name: HOC-Overclocking-Wizard-beta3-clean
          path: |
            HOC-Overclocking-Wizard.nro
            source/updater.cpp
            Makefile
            RELEASE_NOTES_v0.1.0-beta.3.md
