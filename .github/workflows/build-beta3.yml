name: Build OC Wizard beta3

on:
  push:
    branches:
      - oc-wizard-beta3
    paths:
      - '.github/workflows/build-beta3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply beta3 patch
        run: |
          python3 tools/patch_beta3.py
          git config user.name "retrotendo"
          git config user.email "info@retrotendo.de"
          git add source/updater.cpp Makefile RELEASE_NOTES_v0.1.0-beta.3.md
          git commit -m "Fix startup updater socket lifecycle for beta3"
          git push

      - name: Build
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: HOC-Overclocking-Wizard-beta3
          path: HOC-Overclocking-Wizard.nro
