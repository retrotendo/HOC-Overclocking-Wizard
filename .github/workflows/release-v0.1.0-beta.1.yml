name: Publish v0.1.0-beta.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.1.0-beta.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NRO
        run: make -j2

      - name: Create checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.1
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.1
          body_path: RELEASE_NOTES_v0.1.0-beta.1.md
          prerelease: true
          make_latest: false
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
