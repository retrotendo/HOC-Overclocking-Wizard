name: Build OC Wizard beta3 clean

on:
  push:
    branches:
      - oc-wizard-beta3-clean
    paths:
      - '.github/workflows/build-beta3-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build committed source
        run: make -j2

      - name: Create checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256

      - name: Upload final beta3 build
        uses: actions/upload-artifact@v4
        with:
          name: HOC-Overclocking-Wizard-beta3-final
          path: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
