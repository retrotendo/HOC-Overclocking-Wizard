name: Publish v0.1.0-beta.22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.22.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py
      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py
      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py
      - name: Apply beta14 config validation fixes
        run: python3 .github/scripts/build_beta14_patch.py
      - name: Apply beta15 benchmark UI and exact-value fixes
        run: python3 .github/scripts/build_beta15_patch.py
      - name: Apply beta16 RAM step-mode fix
        run: python3 .github/scripts/build_beta16_patch.py
      - name: Apply beta17 fixes
        run: python3 .github/scripts/build_beta17_patch.py
      - name: Apply beta18 preparation-validation fix
        run: python3 .github/scripts/build_beta18_patch.py
      - name: Apply beta19 charger guard and activity heartbeat
        run: python3 .github/scripts/build_beta19_patch.py
      - name: Apply beta20 audible attention reminders
        run: python3 .github/scripts/build_beta20_patch.py
      - name: Apply beta20 compile fix
        run: python3 .github/scripts/build_beta20_fix.py
      - name: Apply beta21 RAM sweep result and UX cleanup
        run: python3 .github/scripts/build_beta21_patch.py
      - name: Apply beta21 final task-card and override cleanup fixes
        run: python3 .github/scripts/build_beta21_fix.py
      - name: Apply beta22 per-frequency SoC curve and private test shortcuts
        run: python3 .github/scripts/build_beta22_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.22
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.22
          prerelease: true
          make_latest: false
          body: |
            Beta 22 adds the full per-frequency RAM SoC curve workflow and private beta-test shortcuts.
            - Every successful RAM Max Clock sweep point stores its exact HOC-selected SoC table value instead of rounded live telemetry.
            - The complete set of stable RAM sweep points keeps those SoC baselines for the later SoC tuning stage.
            - SoC tuning walks the measured RAM curve from high to low and tunes every unique HOC SoC table point at the highest measured RAM frequency that uses it.
            - The optimized SoC value is written back to every RAM sweep point that shares that HOC table entry, so the later performance/electrical-cost graph uses the tuned curve.
            - The old 0 mV SoC initialization/reset is removed; Last Good and Candidate always start from the captured HOC config value.
            - SoC UI uses the exact config-style .5 mV formatting where applicable.
            - Private beta testing shortcut while a stability test is running: ZL+ZR+Plus forces PASS, ZL+ZR+Minus forces FAIL. These shortcuts are intentionally not shown in normal Wizard UI.
            - Beta21 result screen, override cleanup, task-card cleanup, Beta20 audio reminders, charger guard, RUNNING animation, DVB 8 baseline and 60-second RAM stability remain unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
