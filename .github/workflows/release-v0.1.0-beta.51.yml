name: Publish v0.1.0-beta.51

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.51.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative beta51 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.50.yml').read_text()
          anchor='      - name: Build cumulative beta50 source\n'
          start=w.index(anchor)
          runpos=w.index('        run: |\n',start)+len('        run: |\n')
          end=w.index('\n      - name: Build NRO',runpos)
          script=textwrap.dedent(w[runpos:end])
          Path('/tmp/build_beta50_source.sh').write_text(script)
          subprocess.run(['bash','-e','-u','-o','pipefail','/tmp/build_beta50_source.sh'],check=True)
          PY
          python3 .github/scripts/build_beta51_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.51
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.51
          prerelease: true
          make_latest: false
          body: |
            Beta 51 cleans up the RAM target selection page only.
            - Removes the redundant Efficiency/Performance recommendation row from the left content area.
            - Moves the Left/Right navigation guidance into the YOUR TASK box.
            - The task explicitly says to use the Left / Right buttons and is split into readable lines.
            - Selected Target, RAM Score and SoC remain in the left information area.
            - RAM Score, Efficiency/Performance recommendation logic, RAM graph, target explanation, hidden debug, recovery, DVB8 baseline and downstream tuning logic are unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
