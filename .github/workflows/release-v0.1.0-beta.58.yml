name: Publish v0.1.0-beta.58

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.58.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative beta58 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.57.yml').read_text()
          anchor='      - name: Build cumulative beta57 source\n'
          start=w.index(anchor)
          runpos=w.index('        run: |\n',start)+len('        run: |\n')
          end=w.index('\n      - name: Build NRO',runpos)
          script=textwrap.dedent(w[runpos:end])
          Path('/tmp/build_beta57_source.sh').write_text(script)
          subprocess.run(['bash','-e','-u','-o','pipefail','/tmp/build_beta57_source.sh'],check=True)
          PY
          python3 .github/scripts/build_beta58_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.58
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.58
          prerelease: true
          make_latest: false
          body: |
            Beta 58 adjusts only the VDD2 task wording.
            - Changes the task from "Apply VDD2 ... and reboot" to "Continue to apply VDD2 ... and reboot".
            - VDD2 tuning behavior and all other tuning logic are unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
