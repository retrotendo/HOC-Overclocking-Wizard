name: Publish v0.1.0-beta.19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py
      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py
      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py
      - name: Apply beta14 config validation fixes
        run: python3 .github/scripts/build_beta14_patch.py
      - name: Apply beta15 benchmark UI and exact-value fixes
        run: python3 .github/scripts/build_beta15_patch.py
      - name: Apply beta16 RAM step-mode fix
        run: python3 .github/scripts/build_beta16_patch.py
      - name: Apply beta17 fixes
        run: python3 .github/scripts/build_beta17_patch.py
      - name: Apply beta18 preparation-validation fix
        run: python3 .github/scripts/build_beta18_patch.py
      - name: Apply beta19 charger guard and activity heartbeat
        run: python3 .github/scripts/build_beta19_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.19
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.19
          prerelease: true
          make_latest: false
          body: |
            Beta 19 adds USB charger protection and a live activity heartbeat for every running test/benchmark.
            - Tests and benchmarks will not start without a connected USB charger.
            - Removing the charger during a stability test stops and discards the test, clears temporary overrides, shows a reconnect notice and restarts the same test from zero after confirmation.
            - Removing the charger during a performance benchmark aborts/discards the measurement and never records it as a stability failure.
            - RAM Memory Benchmark runs with a continuously refreshed UI so the activity spinner keeps moving even while a benchmark percentage stays unchanged.
            - GPU and CPU performance benchmarks also show live progress/activity and continuously monitor charger status.
            - All Stability Test and Benchmark screens show an independent RUNNING spinner that does not depend on the percentage bar.
            - Beta18 RAM Preparation validation, DVB 8 baseline, exact config values, 60-second RAM stability and existing tuning order are retained.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
