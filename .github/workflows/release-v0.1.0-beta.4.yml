name: Publish v0.1.0-beta.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.1.0-beta.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply beta4 RAM preparation correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Makefile')
          s = p.read_text()
          s = s.replace('APP_VERSION := 0.1.0-beta.3', 'APP_VERSION := 0.1.0-beta.4')
          p.write_text(s)

          p = Path('source/oc_profiles.hpp')
          s = p.read_text()
          s = s.replace('{"NME", "E", 2300, 2766, 1175, 640,', '{"NME", "E", 2300, 2566, 1175, 640,')
          p.write_text(s)

          p = Path('source/main_oc.cpp')
          s = p.read_text()

          # NiklasCFW RAM guide preparation baseline:
          # RAM Max 2200 MHz, Common timings, table VDD2/VDDQ, HP off.
          # DVB 8 is used because the following temporary clock search goes above 2200 MHz.
          s = s.replace('d.ramMaxKHz=3400000U;', 'd.ramMaxKHz=2200000U;')
          s = s.replace('d.dvbShift=5; d.socVmaxUv=1200;', 'd.dvbShift=8; d.socVmaxUv=1200;')
          s = s.replace('occonfig::setRamPreparation(false,3400,p->vdd2Mv,p->vddqMv,5,1200,t,e)',
                        'occonfig::setRamPreparation(false,2200,p->vdd2Mv,p->vddqMv,8,1200,t,e)')
          s = s.replace('g.ramHpMode=0;g.ramTimingMode=0;g.dvbGood=5;g.dvbCandidate=4;',
                        'g.ramHpMode=0;g.ramTimingMode=0;g.dvbGood=8;g.dvbCandidate=7;', 2)
          s = s.replace('p.context="Common / HP off / DVB5";', 'p.context="Common / HP off / DVB8";')

          old = '''case Stage::RamPreparation:{v.stageTitle="RAM Preparation";v.preparationLayout=true;v.hideValuesCard=true;v.instructionTitle="Set the RAM search baseline";v.instructionLine1="Common timings first; HP and ST are validated after max clock discovery.";v.instructionLine2="Y  Apply automatically";const auto*p=profile();gui::begin(v);'''
          new = '''case Stage::RamPreparation:{v.stageTitle="RAM Preparation";v.preparationLayout=true;v.hideValuesCard=true;v.instructionTitle="Set the RAM search baseline";v.instructionLine1="Common timings first; HP and ST are validated after max clock discovery.";v.instructionLine2="Y  Apply automatically";const auto*p=profile();HocMonConfig ac{};const bool haveAc=R_SUCCEEDED(hocmonGetConfig(&ac));v.havePreparationActiveValues=haveAc;if(p){auto addPrep=[&](const char* group,const char* label,const std::string& setv,const std::string& active){gui::PreparationRow r;r.group=group;r.label=label;r.setValue=setv;r.activeValue=active;r.mismatch=haveAc&&(setv!=active);v.preparationRows.push_back(r);};addPrep("RAM","Max Clock","2200 MHz",haveAc?std::to_string(ac.ramMaxKHz/1000)+" MHz":"Unavailable");addPrep("RAM","VDD2",std::to_string(p->vdd2Mv)+" mV",haveAc?fmt1(ac.vdd2Uv/1000.0)+" mV":"Unavailable");addPrep("RAM","VDDQ",std::to_string(p->vddqMv)+" mV",haveAc?fmt1(ac.vddqUv/1000.0)+" mV":"Unavailable");addPrep("RAM","HP Mode","OFF",haveAc?(ac.hpMode?"ON":"OFF"):"Unavailable");}gui::begin(v);'''
          if old not in s:
              raise SystemExit('RamPreparation render block not found; refusing to build an unpatched beta4')
          s = s.replace(old, new, 1)

          # Manual verification must check the same guide baseline shown on screen.
          s = s.replace('d.ramMaxKHz=3400000U;d.vdd2Uv=p->vdd2Mv*1000U;d.vddqUv=p->vddqMv*1000U;d.dvbShift=5;',
                        'd.ramMaxKHz=2200000U;d.vdd2Uv=p->vdd2Mv*1000U;d.vddqUv=p->vddqMv*1000U;d.dvbShift=8;')

          p.write_text(s)
          PY

      - name: Build NRO
        run: make -j2

      - name: Create checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.4
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.4
          body: |
            Beta 4 RAM preparation correction.
            - Preparation SET/ACTIVE rows are populated instead of blank.
            - Preparation values follow the NiklasCFW RAM guide table.
            - RAM Max baseline: 2200 MHz.
            - Common timings with HP Mode OFF.
            - VDD2/VDDQ are selected from the detected RAM profile table.
            - DVB Shift 8 for the following >2200 MHz temporary clock search.
            - NME expected range corrected to 2300-2566 MHz.
          prerelease: true
          make_latest: false
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
