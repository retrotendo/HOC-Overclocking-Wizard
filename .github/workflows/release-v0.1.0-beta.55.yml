name: Publish v0.1.0-beta.55

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.55.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative beta55 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.54.yml').read_text()
          anchor='      - name: Build cumulative beta54 source\n'
          start=w.index(anchor)
          runpos=w.index('        run: |\n',start)+len('        run: |\n')
          end=w.index('\n      - name: Build NRO',runpos)
          script=textwrap.dedent(w[runpos:end])
          Path('/tmp/build_beta54_source.sh').write_text(script)
          subprocess.run(['bash','-e','-u','-o','pipefail','/tmp/build_beta54_source.sh'],check=True)
          PY
          python3 .github/scripts/build_beta55_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.55
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.55
          prerelease: true
          make_latest: false
          body: |
            Beta 55 fixes the RAM-target explanation indentation for real.
            - Replaces whitespace indentation with a renderer-aware indentation marker.
            - Explanatory text is drawn about 40 px to the right of each block heading.
            - Efficiency, Performance, Selected Target, Next Steps and Important are styled as separate headings.
            - Keeps the complete two-page explanation and existing navigation.
            - RAM target task copy, RAM Score, recommendation logic, graph, hidden debug and downstream tuning logic are unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
