name: Publish v0.1.0-beta.16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py

      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py

      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py

      - name: Apply beta14 config validation fixes
        run: python3 .github/scripts/build_beta14_patch.py

      - name: Apply beta15 benchmark UI and exact-value fixes
        run: python3 .github/scripts/build_beta15_patch.py

      - name: Apply beta16 RAM step-mode fix
        run: python3 .github/scripts/build_beta16_patch.py

      - name: Build NRO
        run: make -j2

      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.16
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.16
          prerelease: true
          make_latest: false
          body: |
            Beta 16 fixes the false RAM Max Clock Search stop at 2133 MHz.
            - RAM capability discovery now explicitly sets and verifies HOC RAM Step Mode = 66 MHz.
            - The sweep table now contains only clocks valid for that 66 MHz mode, from 1331 MHz up to 3400 MHz.
            - A clock that cannot be activated is no longer silently treated as a RAM stability failure; the Wizard shows the exact issue and lets the user retry.
            - A Memory Benchmark failure is also not classified as RAM instability.
            - The visible RAM Memory Benchmark progress and exact config-value display from Beta 15 remain included.
            - RAM flow remains Clock -> DVB -> HP -> Tight/ST -> SoC -> Sweet Spot -> Max Clock = Sweet Spot -> VDD2 -> VDDQ.
            - GPU and CPU tuning logic is unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
