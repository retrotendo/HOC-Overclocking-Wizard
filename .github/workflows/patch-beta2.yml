name: Patch OC Wizard beta2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-beta2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta2 branch
        uses: actions/checkout@v4
        with:
          ref: oc-wizard-beta2
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/patch_beta2.py

      - name: Commit beta2 changes
        run: |
          git config user.name "retrotendo"
          git config user.email "info@retrotendo.de"
          git add source/main_oc.cpp Makefile RELEASE_NOTES_v0.1.0-beta.2.md
          git commit -m "Prepare v0.1.0-beta.2 UI and benchmark fixes"
          git push origin HEAD:oc-wizard-beta2
