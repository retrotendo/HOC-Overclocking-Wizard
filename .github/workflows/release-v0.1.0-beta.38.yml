name: Publish v0.1.0-beta.38

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.38.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative beta38 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.37-fix.yml').read_text()
          anchor='      - name: Build cumulative beta37 source\n'
          start=w.index(anchor)
          runpos=w.index('        run: |\n',start)+len('        run: |\n')
          end=w.index('\n      - name: Build NRO',runpos)
          script=textwrap.dedent(w[runpos:end])
          Path('/tmp/build_beta37_source.sh').write_text(script)
          subprocess.run(['bash','-e','-u','-o','pipefail','/tmp/build_beta37_source.sh'],check=True)
          PY
          python3 .github/scripts/build_beta38_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.38
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.38
          prerelease: true
          make_latest: false
          body: |
            Beta 38 is a focused recovery UI cleanup.
            - Interrupted 1-hour RAM confirmation now shows the exact tested RAM frequency in the recovery title.
            - Example: `RAM 3000 MHz confirmation did not finish`.
            - Recovery action labels no longer duplicate the controller letters already rendered by the button icons.
            - The buttons now read `Recover last good value` and `Exit`.
            - Recovery behavior, RAM sweep logic, Beta37 transition handling, DVB8 baseline and Beta32 Membench index are unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
