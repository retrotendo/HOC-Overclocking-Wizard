name: Publish v0.1.0-beta.34

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.34.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py
      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py
      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py
      - name: Apply beta14 config validation fixes
        run: python3 .github/scripts/build_beta14_patch.py
      - name: Apply beta15 benchmark UI and exact-value fixes
        run: python3 .github/scripts/build_beta15_patch.py
      - name: Apply beta16 RAM step-mode fix
        run: python3 .github/scripts/build_beta16_patch.py
      - name: Apply beta17 fixes
        run: python3 .github/scripts/build_beta17_patch.py
      - name: Apply beta18 preparation-validation fix
        run: python3 .github/scripts/build_beta18_patch.py
      - name: Apply beta19 charger guard and activity heartbeat
        run: python3 .github/scripts/build_beta19_patch.py
      - name: Apply beta20 audible attention reminders
        run: python3 .github/scripts/build_beta20_patch.py
      - name: Apply beta20 compile fix
        run: python3 .github/scripts/build_beta20_fix.py
      - name: Apply beta21 RAM sweep result and UX cleanup
        run: python3 .github/scripts/build_beta21_patch.py
      - name: Apply beta21 final task-card and override cleanup fixes
        run: python3 .github/scripts/build_beta21_fix.py
      - name: Apply beta22 per-frequency SoC curve and private test shortcuts
        run: python3 .github/scripts/build_beta22_patch.py
      - name: Apply beta23 task-card wording cleanup
        run: python3 .github/scripts/build_beta23_patch.py
      - name: Apply beta24 final RAM benchmark flow
        run: python3 .github/scripts/build_beta24_patch.py
      - name: Apply beta24 compile fix
        run: python3 .github/scripts/build_beta24_fix.py
      - name: Apply beta25 hardware/preparation UI cleanup
        run: python3 .github/scripts/build_beta25_patch.py
      - name: Apply beta26 global layout cleanup
        run: python3 .github/scripts/build_beta26_patch.py
      - name: Apply beta27 RAM confirmation gate and RAM fail safety
        run: python3 .github/scripts/build_beta27_patch.py
      - name: Apply beta27 compile fix
        run: python3 .github/scripts/build_beta27_fix.py
      - name: Apply beta28 HOC default reset
        run: python3 .github/scripts/build_beta28_patch.py
      - name: Apply beta28 preparation UI and baseline flow
        run: python3 .github/scripts/build_beta28_ui_patch.py
      - name: Apply beta29 RAM result and target flow
        run: python3 .github/scripts/build_beta29_patch.py
      - name: Apply beta30 all-point RAM line graph and high-end recommendation
        run: python3 .github/scripts/build_beta30_patch.py
      - name: Apply beta31 RAM debug data page
        run: python3 .github/scripts/build_beta31_patch.py
      - name: Prepare beta32 audit marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/build_beta32_patch.py')
          s=p.read_text()
          old="'override cleanup retained':'Do not leave the benchmark RAM clock active' in main,"
          new="'override cleanup retained':'clearOverrides();' in main[main.find('bool runFinalRamBenchmarkPoint'):main.find('void finishFinalRamBenchmarkSweep')],"
          if old not in s:
              raise SystemExit('beta32 audit marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply beta32 full RAM metrics and composite index
        run: python3 .github/scripts/build_beta32_patch.py
      - name: Apply beta33 compact RAM preparation summary
        run: python3 .github/scripts/build_beta33_patch.py
      - name: Prepare beta34 recovery insertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/build_beta34_patch.py')
          s=p.read_text()
          old="""# Add sweep handling before the existing tuning-stage recovery cases.\nswitch_marker='''    switch(g.stage){\\n        case Stage::RamDvb:'''\nswitch_repl='''    switch(g.stage){\\n        case Stage::RamSweep:\\n            if(g.ramSweepCandidateInProgress){recoverInterruptedRamSweep();return;}\\n            break;\\n        case Stage::RamDvb:'''\nm=must_replace(m,switch_marker,switch_repl,'RamSweep recovery switch case')\n"""
          new="""# Add sweep handling at the start of recoverInterrupted() regardless of\n# formatting/order of the older recovery cases.\nrecover_pos=m.find('void recoverInterrupted(){')\nif recover_pos<0: raise SystemExit('beta34 recoverInterrupted missing')\nswitch_pos=m.find('switch(g.stage)',recover_pos)\nif switch_pos<0: raise SystemExit('beta34 recovery switch missing')\nswitch_brace=m.find('{',switch_pos)\nif switch_brace<0: raise SystemExit('beta34 recovery switch brace missing')\ninsert='\\n        case Stage::RamSweep:\\n            if(g.ramSweepCandidateInProgress){recoverInterruptedRamSweep();return;}\\n            break;'\nm=m[:switch_brace+1]+insert+m[switch_brace+1:]\n"""
          if old not in s:
              raise SystemExit('beta34 brittle switch block missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply beta34 crash-safe RAM sweep recovery
        run: python3 .github/scripts/build_beta34_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.34
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.34
          prerelease: true
          make_latest: false
          body: |
            Beta 34 fixes hard-crash recovery during the initial RAM Max Clock sweep.
            - The exact RAM candidate is now journaled to state.ini before its temporary MEM override is applied.
            - Recovery no longer depends only on testRunning, so crashes during override activation/clock settling are detected too.
            - After reboot, the Wizard shows an Interrupted RAM Sweep recovery prompt naming the exact MHz candidate that did not complete.
            - Recovering marks that candidate as failed, invalidates stale measurements at or above it, restores the last fully completed stable RAM point and ends the sweep.
            - The Wizard can no longer advance to a higher RAM clock after a hard crash. Example: a crash at 3000 MHz cannot resume at 3066 MHz.
            - Normal cancel, charger-loss and technical-return paths remain retryable and do not become false stability failures.
            - Beta33 Preparation UI, Beta32 full Membench capture/index, 1-hour RAM confirmation, graph/target flow and override cleanup remain unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
