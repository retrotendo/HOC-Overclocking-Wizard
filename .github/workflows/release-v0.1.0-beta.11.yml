name: Publish v0.1.0-beta.11

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.1.0-beta.11.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply beta10 cumulative fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/release-v0.1.0-beta.10.yml').read_text()
          blocks=[]; pos=0
          while True:
              try: start=w.index("          python3 - <<'PY'\n",pos)+len("          python3 - <<'PY'\n")
              except ValueError: break
              end=w.index("\n          PY",start); blocks.append(w[start:end]); pos=end+1
          for i,code in enumerate(blocks): exec(compile(code,f'beta10-{i}','exec'))
          PY
      - name: Apply beta11 UI simplification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile'); s=p.read_text().replace('APP_VERSION := 0.1.0-beta.10','APP_VERSION := 0.1.0-beta.11'); p.write_text(s)
          p=Path('source/main_oc.cpp'); s=p.read_text()
          old='''v.stageTitle="RAM Clock Search";v.instructionTitle="Automatic RAM sweep";v.instructionLine1="Tests RAM clocks from low to high.";v.instructionLine2="A  Start sweep";'''
          new='''v.stageTitle="RAM Clock Search";v.instructionTitle="Start test";v.instructionLine1="";v.instructionLine2="A  Start test";'''
          if old not in s: raise SystemExit('beta11 task marker missing')
          s=s.replace(old,new,1)
          s=s.replace('''print(9,"A : Start automatic sweep");''','''print(9,"A : Start test");''',1)
          p.write_text(s)
          PY
      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.11
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.11
          prerelease: true
          make_latest: false
          body: |
            Beta 11 UI-only change on top of Beta 10.
            - RAM sweep task now simply says Start test.
            - No tuning logic changes.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
