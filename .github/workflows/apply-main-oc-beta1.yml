name: Apply adaptive beta1 main
on:
  push:
    branches: [oc-wizard-beta1]
    paths:
      - '.github/workflows/apply-main-oc-beta1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oc-wizard-beta1
      - name: Apply reviewed adaptive main patch
        run: |
          cat .patchparts/main_oc.part00 .patchparts/main_oc.part01 .patchparts/main_oc.part02 .patchparts/main_oc.part03 .patchparts/main_oc.part04 .patchparts/main_oc.part05 .patchparts/main_oc.part06 > /tmp/main_oc.patch
          git apply --check /tmp/main_oc.patch
          git apply /tmp/main_oc.patch
          rm -rf .patchparts
          rm -f .github/workflows/apply-main-oc-beta1.yml
          git config user.name retrotendo
          git config user.email info@retrotendo.de
          git add -A
          git commit -m 'Implement adaptive OC tuning decision tree'
          git push origin HEAD:oc-wizard-beta1
