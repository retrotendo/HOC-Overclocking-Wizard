name: Publish v0.1.0-beta.52

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.52.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative beta52 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.51.yml').read_text()
          anchor='      - name: Build cumulative beta51 source\n'
          start=w.index(anchor)
          runpos=w.index('        run: |\n',start)+len('        run: |\n')
          end=w.index('\n      - name: Build NRO',runpos)
          script=textwrap.dedent(w[runpos:end])
          Path('/tmp/build_beta51_source.sh').write_text(script)
          subprocess.run(['bash','-e','-u','-o','pipefail','/tmp/build_beta51_source.sh'],check=True)
          PY
          python3 .github/scripts/build_beta52_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.52
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.52
          prerelease: true
          make_latest: false
          body: |
            Beta 52 finalizes the RAM target selection presentation.
            - Removes the redundant recommendation row from the left information area.
            - Moves the navigation hint into YOUR TASK and explicitly says to use the Left / Right buttons.
            - Keeps the task copy on two short readable lines.
            - Changes the X action to "Back to explanation and graph" so the destination is clear.
            - Selected Target, RAM Score and SoC remain visible on the left.
            - RAM Score, Efficiency/Performance recommendation logic, graph, target explanation, hidden debug, recovery, DVB8 baseline and downstream tuning logic are unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
