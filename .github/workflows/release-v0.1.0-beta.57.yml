name: Publish v0.1.0-beta.57

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.57.yml'
  workflow_dispatch:

permissions:
  contents: write

# Retry after RAM target task renderer correction.
jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative beta57 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.56.yml').read_text()
          anchor='      - name: Build cumulative beta56 source\n'
          start=w.index(anchor)
          runpos=w.index('        run: |\n',start)+len('        run: |\n')
          end=w.index('\n      - name: Build NRO',runpos)
          script=textwrap.dedent(w[runpos:end])
          Path('/tmp/build_beta56_source.sh').write_text(script)
          subprocess.run(['bash','-e','-u','-o','pipefail','/tmp/build_beta56_source.sh'],check=True)
          PY
          python3 .github/scripts/build_beta57_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.57
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.57
          prerelease: true
          make_latest: false
          body: |
            Beta 57 fixes the RAM target selection presentation and navigation.
            - Efficiency text now says lower VDD2/VDDQ will reduce overall RAM temperatures and power consumption.
            - RAM target task renders both lines visibly: "Use the Left / Right buttons" / "to select your target frequency."
            - Back from RAM target selection always opens explanation page 1/2.
            - Moves Inspect points further left into the user-marked free area above the graph.
            - RAM Score, Efficiency/Performance recommendation logic, benchmark data, recovery and downstream tuning logic are unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
