name: Publish v0.1.0-beta.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py

      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py

      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py

      - name: Build NRO
        run: make -j2

      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.13
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.13
          prerelease: true
          make_latest: false
          body: |
            Beta 13 fixes the RAM Max Clock Search start path and incorporates the requested UI cleanup.
            - RAM flow remains Clock -> DVB -> HP -> Tight/ST -> SoC -> Sweet Spot -> Max Clock = Sweet Spot -> VDD2 -> VDDQ.
            - RAM-only tests verify the RAM real clock only; CPU/GPU idle downclocking no longer blocks the test from starting.
            - SoC automatic maximum is now 1150 mV.
            - Hardware Detection shows RAM Max Clock, live SoC, DVB Shift, VDDQ, VDD2 and T1-T8 individually.
            - Active values use whole MHz/mV values without decimals.
            - RAM Clock Search renamed to RAM Max Clock Search; X shortcut removed.
            - Warning text is red, cleanly spaced and no longer rendered as a label/value row.
            - Restart-required instructions have additional spacing.
            - Disclaimer does not reappear during an already-started Wizard session after reboot.
            - GPU and CPU tuning logic is unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
