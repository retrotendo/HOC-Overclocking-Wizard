name: Publish v0.1.0-beta.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.1.0-beta.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply beta5 RAM capability-search correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Makefile')
          s = p.read_text()
          s = s.replace('APP_VERSION := 0.1.0-beta.3', 'APP_VERSION := 0.1.0-beta.5')
          p.write_text(s)

          p = Path('source/oc_profiles.hpp')
          s = p.read_text()
          s = s.replace('{"NME", "E", 2300, 2766, 1175, 640,', '{"NME", "E", 2300, 2566, 1175, 640,')
          p.write_text(s)

          p = Path('source/main_oc.cpp')
          s = p.read_text()

          # Keep the proven capability-search method from beta3:
          # profile/default rail values + Common timings + HP off + DVB5.
          # RAM Max 3400 is only the HOC ceiling; the actual test clock is
          # increased step-by-step by the temporary RAM override in RamSweep.

          old = '''case Stage::RamPreparation:{v.stageTitle="RAM Preparation";v.preparationLayout=true;v.hideValuesCard=true;v.instructionTitle="Set the RAM search baseline";v.instructionLine1="Common timings first; HP and ST are validated after max clock discovery.";v.instructionLine2="Y  Apply automatically";const auto*p=profile();gui::begin(v);'''
          new = '''case Stage::RamPreparation:{v.stageTitle="RAM Preparation";v.preparationLayout=true;v.hideValuesCard=true;v.instructionTitle="Set the RAM search baseline";v.instructionLine1="Default/Common timings and standard rail values; only RAM clock changes during the first search.";v.instructionLine2="Y  Apply automatically";const auto*p=profile();HocMonConfig ac{};const bool haveAc=R_SUCCEEDED(hocmonGetConfig(&ac));v.havePreparationActiveValues=haveAc;if(p){auto addPrep=[&](const char* group,const char* label,const std::string& setv,const std::string& active){gui::PreparationRow r;r.group=group;r.label=label;r.setValue=setv;r.activeValue=active;r.mismatch=haveAc&&(setv!=active);v.preparationRows.push_back(r);};addPrep("RAM","Max Clock","3400 MHz",haveAc?std::to_string(ac.ramMaxKHz/1000)+" MHz":"Unavailable");addPrep("RAM","VDD2",std::to_string(p->vdd2Mv)+" mV",haveAc?fmt1(ac.vdd2Uv/1000.0)+" mV":"Unavailable");addPrep("RAM","VDDQ",std::to_string(p->vddqMv)+" mV",haveAc?fmt1(ac.vddqUv/1000.0)+" mV":"Unavailable");addPrep("RAM","HP Mode","OFF",haveAc?(ac.hpMode?"ON":"OFF"):"Unavailable");}gui::begin(v);'''
          if old not in s:
              raise SystemExit('RamPreparation render block not found; refusing to build beta5')
          s = s.replace(old, new, 1)

          # Make the on-screen explanation explicit: 3400 is a ceiling, not
          # the first tested RAM clock. RamSweep still advances one clock step
          # at a time and stops at the first failed/capped candidate.
          s = s.replace('Search controls: HP OFF  |  DVB Shift 5  |  SoC VMAX 1200 mV ceiling',
                        'Search controls: HP OFF  |  DVB Shift 5  |  SoC VMAX 1200 mV ceiling')
          s = s.replace('The table range is guidance, not a hard device limit; search may continue to the HOC safe ceiling.',
                        'Only RAM clock changes here. Each passing candidate advances one step; first fail/cap stops the upward search.')

          p.write_text(s)
          PY

      - name: Build NRO
        run: make -j2

      - name: Create checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.5
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.5
          body: |
            Beta 5 RAM capability-search correction.
            - Removes the incorrect fixed 2200 MHz preparation baseline from Beta 4.
            - Restores the proven Beta 3 capability-search method.
            - Preparation uses the detected RAM profile's standard VDD2/VDDQ values and Common timings.
            - HP Mode remains OFF and DVB Shift 5 during initial max-clock discovery.
            - HOC RAM Max remains 3400 MHz only as the ceiling; it is not the tested starting clock.
            - RamSweep changes only RAM clock, one candidate step at a time, with a short stability test; first fail/cap ends the upward search.
            - Preparation SET/ACTIVE rows are populated for RAM Max, VDD2, VDDQ and HP Mode.
            - NME expected range corrected to 2300-2566 MHz.
          prerelease: true
          make_latest: false
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
