name: Publish v0.1.0-beta.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py

      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py

      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py

      - name: Apply beta14 config validation fixes
        run: python3 .github/scripts/build_beta14_patch.py

      - name: Apply beta15 benchmark UI and exact-value fixes
        run: python3 .github/scripts/build_beta15_patch.py

      - name: Build NRO
        run: make -j2

      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.15
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.15
          prerelease: true
          make_latest: false
          body: |
            Beta 15 makes the RAM benchmark phase visible and preserves config values exactly.
            - RAM Max Clock Search keeps the 45-second stability test per clock.
            - The following Memory Benchmark now has its own visible progress screen with percentage and current benchmark step.
            - Bandwidth, latency and performance score are still recorded for the later RAM efficiency / Sweet Spot graph.
            - Config values are displayed without rounding; fractional mV values are preserved exactly.
            - SoC half-steps such as 637.5 mV remain visible as selected in HOC.
            - RAM validation remains config-based and the tuning order is unchanged.
            - GPU and CPU tuning logic is unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
