name: Publish v0.1.0-beta.50

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.50.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative beta50 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.49.yml').read_text()
          anchor='      - name: Build cumulative beta49 source\n'
          start=w.index(anchor)
          runpos=w.index('        run: |\n',start)+len('        run: |\n')
          end=w.index('\n      - name: Build NRO',runpos)
          script=textwrap.dedent(w[runpos:end])
          Path('/tmp/build_beta49_source.sh').write_text(script)
          subprocess.run(['bash','-e','-u','-o','pipefail','/tmp/build_beta49_source.sh'],check=True)
          PY
          python3 .github/scripts/build_beta50_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.50
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.50
          prerelease: true
          make_latest: false
          body: |
            Beta 50 fixes the RAM target explanation page being visually truncated.
            - Keeps the full-width layout and removes the separate YOUR TASK box.
            - Rewrites the explanation into shorter fixed lines so every important point fits on one page without scrolling.
            - Clearly explains Efficiency and Performance targets.
            - States that the selected target becomes the profile maximum.
            - States that VDD2/VDDQ are tuned for that target next.
            - Warns not to use higher RAM clocks afterward unless VDD2/VDDQ are retuned for the higher target.
            - RAM Score, Efficiency/Performance recommendation logic, RAM graph, hidden debug, recovery and downstream tuning logic are unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
