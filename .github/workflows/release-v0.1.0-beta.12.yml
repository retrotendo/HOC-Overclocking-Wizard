name: Publish v0.1.0-beta.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 guide flow
        run: python3 .github/scripts/build_beta12_patch.py

      - name: Remove misplaced recovery cases
        run: python3 .github/scripts/build_beta12_fix.py

      - name: Build NRO
        run: make -j2

      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.12
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.12
          prerelease: true
          make_latest: false
          body: |
            Beta 12 RAM workflow aligned to the measured tuning method.
            - RAM flow: Clock -> DVB -> HP -> Tight/ST -> SoC -> Sweet Spot -> Max Clock = Sweet Spot -> VDD2 -> VDDQ.
            - RAM sweep begins at HOC's exact handheld stock clock, 1331 MHz.
            - DVB is tuned with Common timings and HP OFF.
            - Tight/ST must pass at the already validated DVB value and no longer raises DVB automatically.
            - After SoC tuning, the efficiency graph selects the Sweet Spot and the Wizard sets it as Max RAM Clock before VDD2/VDDQ tuning.
            - GPU and CPU tuning logic is unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
