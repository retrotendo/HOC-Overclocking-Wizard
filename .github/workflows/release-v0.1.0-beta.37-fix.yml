name: Publish v0.1.0-beta.37 fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.37-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative beta37 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.36-fix.yml').read_text()
          anchor='      - name: Build cumulative beta36 source\n'
          start=w.index(anchor)
          runpos=w.index('        run: |\n',start)+len('        run: |\n')
          end=w.index('\n      - name: Build NRO',runpos)
          script=textwrap.dedent(w[runpos:end])
          Path('/tmp/build_beta36_source.sh').write_text(script)
          subprocess.run(['bash','-e','-u','-o','pipefail','/tmp/build_beta36_source.sh'],check=True)
          PY
          python3 .github/scripts/build_beta37_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.37
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.37
          prerelease: true
          make_latest: false
          body: |
            Beta 37 fixes the beta36 RAM sweep false-PASS regression and makes the visible transition match recovery state.
            - Reaching 100% no longer commits a RAM candidate as stable.
            - PASS is committed only after the stress engine fully returns cleanly.
            - After PASS, RAM override is OFF before the next-candidate screen is drawn.
            - The display changes to the next RAM frequency before that frequency is armed/applied.
            - A freeze while applying the next clock therefore leaves the correct next candidate visible and journaled.
            - Recovery asks about one candidate only; the 1-hour confirmation page remains simplified.
            - DVB8 baseline, Beta32 Membench index and all downstream RAM tuning are unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
