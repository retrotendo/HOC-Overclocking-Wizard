name: Replace adaptive beta1 main
on:
  push:
    branches: [oc-wizard-beta1]
    paths:
      - '.github/workflows/replace-main-oc-beta1.yml'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oc-wizard-beta1
      - name: Install reviewed adaptive main source
        run: |
          cat .srcparts/part00 .srcparts/part01 | base64 -d | gunzip > source/main_oc.cpp
          echo 'a0b187f9dd39453f392064b2c8a3e63a9c98d5251d1c6fc5fe400be8f3191f02  source/main_oc.cpp' | sha256sum -c -
          rm -rf .srcparts .patchparts
          rm -f .github/workflows/apply-main-oc-beta1.yml .github/workflows/replace-main-oc-beta1.yml
          git config user.name retrotendo
          git config user.email info@retrotendo.de
          git add -A
          git commit -m 'Implement adaptive OC tuning decision tree'
          git push origin HEAD:oc-wizard-beta1
