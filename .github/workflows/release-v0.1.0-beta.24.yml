name: Publish v0.1.0-beta.24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py
      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py
      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py
      - name: Apply beta14 config validation fixes
        run: python3 .github/scripts/build_beta14_patch.py
      - name: Apply beta15 benchmark UI and exact-value fixes
        run: python3 .github/scripts/build_beta15_patch.py
      - name: Apply beta16 RAM step-mode fix
        run: python3 .github/scripts/build_beta16_patch.py
      - name: Apply beta17 fixes
        run: python3 .github/scripts/build_beta17_patch.py
      - name: Apply beta18 preparation-validation fix
        run: python3 .github/scripts/build_beta18_patch.py
      - name: Apply beta19 charger guard and activity heartbeat
        run: python3 .github/scripts/build_beta19_patch.py
      - name: Apply beta20 audible attention reminders
        run: python3 .github/scripts/build_beta20_patch.py
      - name: Apply beta20 compile fix
        run: python3 .github/scripts/build_beta20_fix.py
      - name: Apply beta21 RAM sweep result and UX cleanup
        run: python3 .github/scripts/build_beta21_patch.py
      - name: Apply beta21 final task-card and override cleanup fixes
        run: python3 .github/scripts/build_beta21_fix.py
      - name: Apply beta22 per-frequency SoC curve and private test shortcuts
        run: python3 .github/scripts/build_beta22_patch.py
      - name: Apply beta23 task-card wording cleanup
        run: python3 .github/scripts/build_beta23_patch.py
      - name: Apply beta24 final RAM benchmark flow
        run: python3 .github/scripts/build_beta24_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.24
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.24
          prerelease: true
          make_latest: false
          body: |
            Beta 24 moves RAM performance measurement to the methodologically correct point in the tuning flow.
            - RAM Max Clock Search now performs only clock activation / PLL validation and a 60-second stability test. No memory benchmark runs during capability discovery.
            - HP Mode and Tight Timing validation are stability-only decisions; their temporary benchmark runs are removed.
            - Per-frequency SoC tuning remains unchanged and still stores the optimized SoC curve for every measured RAM point.
            - After DVB, HP Mode, timings and the full SoC curve are finalized, a new automatic Final RAM Benchmark Sweep measures every stable RAM frequency.
            - Final benchmark points use the already tuned per-frequency SoC value plus the validated DVB / HP / timing configuration.
            - Only these final benchmark measurements feed the RAM performance / electrical-cost graph and Sweet Spot analysis.
            - The final benchmark sweep checks that the active HOC SoC table value matches the tuned value saved for each RAM frequency before measuring it.
            - The test-screen activity spinner remains, but the redundant RUNNING label is removed. The footer now only reminds the user to keep the USB charger connected.
            - Beta23 task-card cleanup, Beta22 private force PASS/FAIL shortcuts, result screen, override cleanup, charger guard and audio reminders remain unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
