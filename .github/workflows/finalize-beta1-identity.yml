name: Finalize OC beta1 identity
on:
  push:
    branches: [oc-wizard-beta1]
    paths:
      - '.github/workflows/finalize-beta1-identity.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oc-wizard-beta1
      - name: Finalize independent OC app identity and docs
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's#sdmc:/switch/HOC-Undervolting-Wizard/HOC-Overclocking-Wizard.nro#sdmc:/switch/HOC-Overclocking-Wizard/HOC-Overclocking-Wizard.nro#g' source/updater.cpp
          grep -q 'sdmc:/switch/HOC-Overclocking-Wizard/HOC-Overclocking-Wizard.nro' source/updater.cpp
          if grep -q 'sdmc:/switch/HOC-Undervolting-Wizard/HOC-Overclocking-Wizard.nro' source/updater.cpp; then
            echo 'Old updater path still present' >&2
            exit 1
          fi

          rm -f CHANGELOG.md RELEASE_NOTES_beta*.md RELEASE_NOTES_v0.4.0-beta.*.md

          cat > README.md <<'EOF'
          # HOC Overclocking Wizard

          A guided, adaptive Nintendo Switch overclocking assistant for **Horizon OC** on **Mariko** systems (Switch V2 / Lite / OLED).

          The Wizard is intentionally **device-specific**. It does not copy one console's MHz or mV values. RAM, GPU and CPU limits are measured on the current console and the final recommendations are derived from stability, real clocks, benchmark performance and electrical cost.

          ## Core workflow

          1. Detect console and DRAM type.
          2. Create a safety backup and establish a known HOC baseline.
          3. Apply the DRAM-specific **Common** timing baseline from the Horizon OC RAM table.
          4. Measure the RAM clock curve, then validate optional Super Tight timings and optimize RAM rails / SoC one variable at a time.
          5. Measure and tune the GPU curve, then validate GPU + RAM together.
          6. Measure the CPU curve with final RAM, determine Low/High UV behavior and TBreak from the measured transition, then tune High VMIN and VMAX last.
          7. Re-open earlier recommendations when a later combined test proves that another system-level point is better.
          8. Show graphs for Stable Max, Sweet Spot and Recommended values.
          9. Save the final HOC profile to **Performance Modes · OC Mode**.

          ## Adaptive decisions

          The Wizard keeps all measured points instead of treating a completed section as permanently fixed. A later CPU + RAM or GPU + RAM failure can cause the Wizard to compare one-step backoffs and revise an earlier RAM/GPU/CPU recommendation when the performance loss is small but stability or electrical cost improves substantially.

          **Only one setting is changed at a time during diagnosis.** If a diagnostic change does not fix the failure, that setting is restored before another domain is tested.

          ## Benchmark conditions

          For comparable measurements the Wizard expects the console to remain on the same charger and in the same operating state for a measurement series. Start with a fully charged battery, set brightness to **100%**, and disable automatic screen dimming / sleep while tuning.

          Performance measurements are based on the embedded Horizon OC / Benchmark Toolbox workloads:

          - RAM: memory bandwidth + latency benchmark
          - GPU: Furmark/Benchmark Toolbox FPS measurement plus GPU stability verification
          - CPU: Benchmark Toolbox CPU Ray Trace FPS plus CPU/combined stability tests

          HOC voltage and battery-side power telemetry are recorded alongside benchmark data. Battery-fuel-gauge power is treated as supplemental telemetry, not as wall-power measurement.

          ## Safety

          Overclocking and RAM tuning can crash the console and can risk SD/NAND corruption. Keep current backups before starting. The Wizard uses Horizon OC's documented platform limits as safety/search boundaries, but no overclock is guaranteed safe or stable on every device.

          This is an early beta. Review every requested change and keep a known-good CFW/No-OC recovery path available.

          ## Credits / license

          HOC Overclocking Wizard is GPL-2.0. It incorporates/adapts GPL-compatible components and interfaces from Horizon OC / Benchmark Toolbox and the existing HOC Undervolting Wizard foundation. See source headers and `LICENSE` for attribution.
          EOF

          cat > TUNING_DECISION_TREE.md <<'EOF'
          # OC Wizard tuning decision tree

          This document is the implementation contract for the adaptive OC guide.

          ## Non-negotiable rule

          **No end value from the development/test console is a target.** Development measurements are evidence for relationships and diagnostic rules only. HOC/platform documentation supplies safety boundaries; the active console supplies the tuning results.

          ## Measurement model

          Every retained point should record, where available:

          - requested and real clock
          - relevant rail voltage(s)
          - benchmark performance (RAM score/latency, GPU FPS, CPU FPS)
          - stability result
          - combined-stability context
          - comparable battery-side power telemetry

          Each domain exposes three distinct results:

          - **Stable Max**: highest validated point inside the supported safety envelope
          - **Sweet Spot**: knee of measured performance versus electrical cost
          - **Recommended**: daily/system recommendation after all later combination tests

          ## RAM

          1. Detect DRAM and select the matching HOC table row.
          2. Use Common timings and conservative table voltages as the starting baseline.
          3. Sweep RAM clocks within the DRAM-informed search range; do not assume the table average is the device maximum.
          4. Build the RAM performance curve and identify Stable Max / initial Sweet Spot.
          5. Only after the clock region is known, optionally test Super Tight timings.
          6. Optimize HP/DVB/VDD2/VDDQ/SoC one domain at a time with rollback on failure.
          7. Keep measurement history because later GPU/CPU combination tests may lower the final RAM recommendation.

          ## GPU

          1. Keep CPU conservative and use a safe RAM context for the initial GPU voltage/performance curve.
          2. Tune GPU points individually and record real voltage + FPS/performance.
          3. Do not assume an individually stable GPU point is stable with fast RAM.
          4. Re-test important/recommended GPU points with the RAM recommendation.
          5. On GPU + RAM failure, diagnose one domain at a time: first make the GPU point safer and retest; if that does not solve it, restore GPU and test the RAM/SoC side. Compare one-step backoffs before choosing the final system recommendation.
          6. Keep HOC's RAM-dependent GPU DVFS floor relationship intact unless a later dedicated test proves a change beneficial.

          ## CPU

          1. Use final/recommended RAM for the decisive CPU validation, because RAM can change CPU voltage requirements.
          2. Measure the High region and the Low region rather than assuming one fixed TBreak.
          3. High UV must be checked at more than only the maximum CPU clock; a lower point can be the combined-load failure point.
          4. Low UV and Low VMIN are a coupled curve problem. Do not independently chase the lowest VMIN and most aggressive Low UV.
          5. Use 1020 MHz as an important Low-region stability anchor and also validate an upper Low-region point near the eventual TBreak.
          6. Choose TBreak after both Low and High curves are known. Place the transition where the measured curves give the cleaner/lower stable voltage transition, then revalidate the moved boundary with final RAM.
          7. Tune High VMIN after TBreak.
          8. Tune VMAX last. Every VMAX test must verify **real clock**; a voltage cap that silently reduces real frequency is not a successful undervolt.

          ## Combined-failure diagnosis

          A failure proves only that the combination is unstable. It does not identify the guilty domain.

          - Change exactly **one** variable/domain.
          - Re-run the same test.
          - PASS: that change identifies a likely limiting side; validate it longer.
          - FAIL: restore the change before trying the next domain.
          - Never accumulate several speculative changes.

          For CPU + RAM failures, compare a safer CPU UV step against a one-step RAM/SoC/VDD2 correction/backoff. For GPU + RAM failures, compare a safer GPU point against a one-step RAM-side correction/backoff. Prefer the system solution with the smallest measured performance loss and best stability/electrical cost.

          ## Feedback loop

          RAM, GPU and CPU sections are not final when their first graph is shown. Later combined validation may reopen an earlier recommendation. The graph/history should preserve the original measurement and mark the final recommendation as adjusted by combined validation.

          ## Daily recommendation

          The lowest technically stable value or highest technically stable clock is not automatically the daily recommendation. Prefer a small stability margin when the extra performance/efficiency from the edge point is negligible.
          EOF

          cat > RELEASE_NOTES_v0.1.0-beta.1.md <<'EOF'
          # HOC Overclocking Wizard v0.1.0-beta.1

          First experimental beta of the adaptive HOC Overclocking Wizard.

          - independent OC app/state/updater paths
          - orange/red beta52-derived graphical interface
          - DRAM detection with HOC-informed Common/ST timing profiles
          - RAM clock/performance sweep and graphing
          - RAM HP/DVB/VDD2/VDDQ/SoC tuning stages
          - embedded Benchmark Toolbox memory, GPU FPS and CPU Ray Trace FPS measurements
          - GPU voltage/performance sweep and GPU + RAM integration validation
          - CPU Low/High UV, TBreak, High VMIN and VMAX guided stages
          - real-clock verification for capped CPU operation
          - adaptive combined-failure backoff logic instead of fixed device values
          - Stable Max / Sweet Spot / Recommended graph markers
          - safety backup and final save to Performance Modes · OC Mode

          This is an early testing beta. Keep a known-good No-OC boot path and current backups available.
          EOF

          cat > UPDATE.txt <<'EOF'
          version=0.1.0-beta.1
          nro_url=https://github.com/retrotendo/HOC-Overclocking-Wizard/releases/download/v0.1.0-beta.1/HOC-Overclocking-Wizard.nro
          sha_url=https://github.com/retrotendo/HOC-Overclocking-Wizard/releases/download/v0.1.0-beta.1/HOC-Overclocking-Wizard.nro.sha256
          EOF

          git config user.name retrotendo
          git config user.email info@retrotendo.de
          git add -A
          git commit -m 'Finalize independent OC beta1 identity and guide contract'
          git push origin HEAD:oc-wizard-beta1
