name: Publish v0.1.0-beta.37

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.37.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative beta37 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap

          # Reuse the exact already-green cumulative beta36 source recipe so this
          # release cannot silently diverge from the tested patch chain.
          w=Path('.github/workflows/release-v0.1.0-beta.36-fix.yml').read_text()
          anchor='      - name: Build cumulative beta36 source\n'
          start=w.index(anchor)
          runpos=w.index('        run: |\n',start)+len('        run: |\n')
          end=w.index('\n      - name: Build NRO',runpos)
          script=textwrap.dedent(w[runpos:end])
          Path('/tmp/build_beta36_source.sh').write_text(script)
          subprocess.run(['bash','-e','-u','-o','pipefail','/tmp/build_beta36_source.sh'],check=True)
          PY
          python3 .github/scripts/build_beta37_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.37
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.37
          prerelease: true
          make_latest: false
          body: |
            Beta 37 fixes the beta36 RAM sweep false-PASS regression and makes the visible transition match recovery state.
            - Reaching 100% no longer commits a RAM candidate as stable.
            - A RAM sweep candidate is committed PASS only after the full stress engine returns cleanly, including memtester shutdown.
            - A hard freeze after the timer reaches 100% therefore still belongs to the currently active candidate.
            - After a clean PASS, the temporary RAM override is removed before the result is committed.
            - While no override is active, the screen changes to `Next RAM candidate: <MHz>` before the next clock is armed/applied.
            - If the next RAM clock freezes during override activation, the last visible screen already names the correct candidate.
            - Recovery continues to ask about one candidate only; the 1-hour confirmation page stays simplified.
            - DVB8 baseline, 1-hour confirmation, Beta32 full Membench index and all downstream tuning remain unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
