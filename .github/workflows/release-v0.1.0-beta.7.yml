name: Publish v0.1.0-beta.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply beta7 HOC config display fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile'); s=p.read_text(); s=s.replace('APP_VERSION := 0.1.0-beta.3','APP_VERSION := 0.1.0-beta.7'); p.write_text(s)

          p=Path('source/oc_config.hpp'); s=p.read_text()
          needle='LayoutInfo detect();\n'
          add='''LayoutInfo detect();\n\nstruct RamConfig {\n    bool ok = false;\n    bool hpMode = false;\n    std::uint32_t ramMaxMHz = 0;\n    std::uint32_t vdd2Uv = 0;\n    std::uint32_t vddqUv = 0;\n    int dvbShift = 0;\n    int socVmaxMv = 0;\n    std::uint32_t timings[8]{};\n};\n\nbool getRamConfig(RamConfig& out, std::string& error);\n'''
          if needle not in s: raise SystemExit('hpp marker missing')
          s=s.replace(needle,add,1); p.write_text(s)

          p=Path('source/oc_config.cpp'); s=p.read_text()
          marker='''bool setRamPreparation(bool hpMode,std::uint32_t ramMaxMHz'''
          getter='''bool getRamConfig(RamConfig& out,std::string& error){\n    std::array<u64,256> v{};bool old=false;const Idx*i=nullptr;if(!read(v,old,i,error))return false;\n    out.ok=true;out.hpMode=v[i->hp]!=0;out.ramMaxMHz=std::uint32_t(v[i->ramMax]/1000ULL);out.vdd2Uv=std::uint32_t(v[i->memVolt]);out.vddqUv=std::uint32_t(v[i->vddq]);out.dvbShift=int(v[i->dvb]);out.socVmaxMv=int(v[i->socVmax]);for(int n=0;n<8;++n)out.timings[n]=std::uint32_t(v[i->timing0+n]);return true;\n}\n\n'''
          if marker not in s: raise SystemExit('cpp marker missing')
          s=s.replace(marker,getter+marker,1); p.write_text(s)

          p=Path('source/main_oc.cpp'); s=p.read_text()
          # Populate Hardware Detection ACTIVE card from the current HOC config: RAM timings only.
          old='''            gui::begin(v);\n            if(!detected){'''
          new='''            if(detected){\n                occonfig::RamConfig rc{}; std::string re;\n                if(occonfig::getRamConfig(rc,re)){\n                    v.haveActiveValues=true;\n                    std::ostringstream rt; for(int i=0;i<8;++i){if(i)rt<<'-';rt<<rc.timings[i];}\n                    setValue(0,"RAM Timings",rt.str());\n                }\n            }\n            gui::begin(v);\n            if(!detected){'''
          if old not in s: raise SystemExit('hardware marker missing')
          s=s.replace(old,new,1)

          # Preparation SET/ACTIVE table. SET always comes from the profile; ACTIVE comes from HOC config.
          old='''        case Stage::RamPreparation:{v.stageTitle="RAM Preparation";v.preparationLayout=true;v.hideValuesCard=true;v.instructionTitle="Set the RAM search baseline";v.instructionLine1="Common timings first; HP and ST are validated after max clock discovery.";v.instructionLine2="Y  Apply automatically";const auto*p=profile();gui::begin(v);'''
          new='''        case Stage::RamPreparation:{v.stageTitle="RAM Preparation";v.preparationLayout=true;v.hideValuesCard=true;v.instructionTitle="Set the RAM search baseline";v.instructionLine1="Common timings first; HP and ST are validated after max clock discovery.";v.instructionLine2="Y  Apply automatically";const auto*p=profile();\n            if(p){\n                occonfig::RamConfig rc{};std::string re;const bool have=occonfig::getRamConfig(rc,re);v.havePreparationActiveValues=have;\n                auto row=[&](const char*g,const char*l,const std::string&set,const std::string&act,bool mm){v.preparationRows.push_back({g,l,set,act,mm});};\n                auto timingString=[&](const std::uint32_t*t){std::ostringstream o;for(int i=0;i<8;++i){if(i)o<<'-';o<<t[i];}return o.str();};\n                row("RAM","Max Clock","3400 MHz",have?std::to_string(rc.ramMaxMHz)+" MHz":"unavailable",have&&rc.ramMaxMHz!=3400);\n                row("RAM","VDD2",std::to_string(p->vdd2Mv)+" mV",have?fmtMvUv(int(rc.vdd2Uv)):"unavailable",have&&int(rc.vdd2Uv)!=p->vdd2Mv*1000);\n                row("RAM","VDDQ",std::to_string(p->vddqMv)+" mV",have?fmtMvUv(int(rc.vddqUv)):"unavailable",have&&int(rc.vddqUv)!=p->vddqMv*1000);\n                row("RAM","HP Mode","OFF",have?(rc.hpMode?"ON":"OFF"):"unavailable",have&&rc.hpMode);\n                row("RAM","DVB Shift","5",have?std::to_string(rc.dvbShift):"unavailable",have&&rc.dvbShift!=5);\n                row("RAM","SoC VMAX","1200 mV",have?std::to_string(rc.socVmaxMv)+" mV":"unavailable",have&&rc.socVmaxMv!=1200);\n                row("RAM","Common Timings",timingString(p->common.t),have?timingString(rc.timings):"unavailable",have&&timingString(rc.timings)!=timingString(p->common.t));\n            }\n            gui::begin(v);'''
          if old not in s: raise SystemExit('preparation marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.7
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.7
          prerelease: true
          make_latest: false
          body: |
            Beta 7 fixes RAM preparation value display.
            - SET values are always populated from the selected RAM preparation profile.
            - ACTIVE values are read from the current HOC configuration instead of telemetry.
            - Hardware Detection shows only the current RAM Timings value.
            - Automatic RAM sweep behavior from Beta 6 is retained unchanged.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
