name: Publish v0.1.0-beta.17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py
      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py
      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py
      - name: Apply beta14 config validation fixes
        run: python3 .github/scripts/build_beta14_patch.py
      - name: Apply beta15 benchmark UI and exact-value fixes
        run: python3 .github/scripts/build_beta15_patch.py
      - name: Apply beta16 RAM step-mode fix
        run: python3 .github/scripts/build_beta16_patch.py
      - name: Apply beta17 fixes
        run: python3 .github/scripts/build_beta17_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.17
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.17
          prerelease: true
          make_latest: false
          body: |
            Beta 17 fixes the remaining RAM Max Clock Search and active-value display issues.
            - RAM preparation baseline now uses DVB Shift 8; DVB optimization starts from candidate 7.
            - RAM Max Clock stability phase is 60 seconds per clock.
            - RAM override verification now waits/polls for the HOC clock transition instead of failing after one 500 ms snapshot.
            - If a RAM clock still cannot settle, the notice reports requested, override and real RAM clocks.
            - ACTUAL ACTIVE VALUES now use HOC config-selected values throughout RAM/GPU/CPU pages instead of live clock/voltage telemetry where a config value exists.
            - Config voltages use exact formatting with fractional values preserved.
            - Visible RAM Memory Benchmark remains enabled and continues feeding the later efficiency/Sweet Spot graph.
            - RAM tuning order and GPU/CPU tuning logic are otherwise unchanged.
            - Rebuilt after split DVB baseline audit.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
