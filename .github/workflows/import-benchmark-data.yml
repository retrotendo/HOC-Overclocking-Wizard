name: Import pinned Benchmark Toolbox data
on:
  push:
    branches: [oc-wizard-beta1]
    paths:
      - '.github/workflows/import-benchmark-data.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oc-wizard-beta1
      - name: Import pinned Horizon-OC Benchmark Toolbox assets
        run: |
          set -euo pipefail
          PIN=d7c9ad8515abf8513e0e52d47fb769e3b18322db
          BASE="https://raw.githubusercontent.com/Horizon-OC/Horizon-OC/${PIN}/Source/Benchmark-Toolbox/data"
          mkdir -p data
          for f in colormap.png compute_shader.bin fur.png noise.png sk.png wall.png wunk.png; do
            curl -L --fail --retry 3 "${BASE}/${f}" -o "data/${f}"
          done
          git config user.name retrotendo
          git config user.email info@retrotendo.de
          git add data
          git commit -m 'Import pinned Benchmark Toolbox assets'
          git push origin HEAD:oc-wizard-beta1
