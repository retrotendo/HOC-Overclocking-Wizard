name: Publish v0.1.0-beta.20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0-beta.20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta9 cumulative base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/release-v0.1.0-beta.9.yml').read_text()
          blocks=[]
          pos=0
          marker="          python3 - <<'PY'\n"
          while True:
              try:
                  start=w.index(marker,pos)+len(marker)
              except ValueError:
                  break
              end=w.index("\n          PY",start)
              blocks.append(textwrap.dedent(w[start:end]))
              pos=end+1
          if len(blocks) != 3:
              raise SystemExit(f'Expected 3 beta9 patch blocks, found {len(blocks)}')
          for i,code in enumerate(blocks):
              exec(compile(code,f'beta9-{i+1}','exec'))
          PY

      - name: Apply beta12 RAM flow
        run: python3 .github/scripts/build_beta12_patch.py
      - name: Apply beta12 compile fix
        run: python3 .github/scripts/build_beta12_fix.py
      - name: Apply beta13 fixes
        run: python3 .github/scripts/build_beta13_patch.py
      - name: Apply beta14 config validation fixes
        run: python3 .github/scripts/build_beta14_patch.py
      - name: Apply beta15 benchmark UI and exact-value fixes
        run: python3 .github/scripts/build_beta15_patch.py
      - name: Apply beta16 RAM step-mode fix
        run: python3 .github/scripts/build_beta16_patch.py
      - name: Apply beta17 fixes
        run: python3 .github/scripts/build_beta17_patch.py
      - name: Apply beta18 preparation-validation fix
        run: python3 .github/scripts/build_beta18_patch.py
      - name: Apply beta19 charger guard and activity heartbeat
        run: python3 .github/scripts/build_beta19_patch.py
      - name: Apply beta20 audible attention reminders
        run: python3 .github/scripts/build_beta20_patch.py

      - name: Build NRO
        run: make -j2
      - name: Checksum
        run: sha256sum HOC-Overclocking-Wizard.nro > HOC-Overclocking-Wizard.nro.sha256
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.20
          target_commitish: main
          name: HOC Overclocking Wizard v0.1.0-beta.20
          prerelease: true
          make_latest: false
          body: |
            Beta 20 adds audible attention reminders on top of Beta 19.
            - Generates a short, clearly audible two-part rising whoop directly as PCM; no external audio file is required.
            - Finishing a stability test or performance benchmark arms the reminder.
            - If another automatic test/benchmark starts immediately, the pending sound is cancelled, so automatic sweeps do not beep between candidates.
            - If the Wizard remains idle waiting for user input, the whoop plays after about one second.
            - With no input, the reminder repeats every five minutes until the user reacts or new work starts.
            - USB charger disconnect/reconnect-required notices get an immediate audible alert.
            - Beta19 charger protection, live RUNNING animation, RAM benchmark UI, Beta18 preparation validation, DVB 8 baseline, exact config values and 60-second RAM stability are retained.
          files: |
            HOC-Overclocking-Wizard.nro
            HOC-Overclocking-Wizard.nro.sha256
